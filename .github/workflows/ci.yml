# Checagem de PR: o projeto dbt compila (sintaxe, refs e testes declarados) sem tocar no BigQuery.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: dbt parse
        working-directory: dbt
        run: dbt deps && dbt parse --profiles-dir .
