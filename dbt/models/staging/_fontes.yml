version: 2

sources:
  - name: bruto
    database: corinthians-dados
    tables:
      - name: espn_partidas
        description: JSON cru de cada partida, uma linha por coleta (append-only).
      - name: ge_tecnicos
        description: Técnicos de cada partida lidos da página do jogo no ge.globo (pipeline/extrai_ge.py).

  - name: legado
    database: corinthians-dados
    description: Base coletada manualmente até fev/2026 (cópia fiel do SQL Server).
    tables:
      - name: partidas_cor
      - name: escalacoes
      - name: gols_corinthians
      - name: gols_adversario
      - name: assistencias_cor
      - name: cartoes_amarelos
      - name: cartoes_vermelhos
      - name: jogadores
      - name: adversarios
      - name: arbitros
      - name: tecnicos
      - name: tecnicos_cor
      - name: campeonatos
